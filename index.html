<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLA-MD Live Previewer | Editor Markdown en Vivo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="container">
    <header class="main-header">
      <div class="header-left">
        <img src="/assets/Logo.svg" alt="Logo CLA-MD" class="header-logo">
        <h1>CLA-MD Live Previewer</h1>
      </div>
      <div class="layout-buttons">
        <button class="layout-btn" id="clear-storage-btn" title="Restaurar contenido inicial">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/>
            <path d="M21 3v5h-5"/>
            <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/>
            <path d="M8 16H3v5"/>
          </svg>
        </button>
        <button class="layout-btn" id="layout-toggle" title="Cambiar layout">
          <span id="layout-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
              <rect x="3" y="4" width="7" height="16" rx="2"/>
              <rect x="14" y="4" width="7" height="16" rx="2"/>
            </svg>
          </span>
        </button>
      </div>
    </header>
    
    <main id="main-content">
      <section class="editor-container">
        <section class="editor-pane">
          <div class="pane-header">Markdown</div>
          <textarea id="markdown-input" placeholder="Escribe tu Markdown aquí..."></textarea>
          <div class="floating-buttons">
            <button class="floating-btn" id="clear-btn" title="Limpiar todo">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
              </svg>
            </button>
            <button class="floating-btn" id="copy-btn" title="Copiar Markdown">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <rect width="13" height="13" x="9" y="9" rx="2"/>
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
              </svg>
            </button>
          </div>
        </section>
        
        <div class="resizer" id="resizer"></div>
        
        <section class="preview-pane">
          <div class="pane-header">Preview</div>
          <div id="preview" class="markdown-content"></div>
        </section>
      </section>
    </main>
    
    <footer>
      <p>Desarrollado por <a style="color: blueviolet; font-weight: 600; text-decoration: none;" href="https://claangel.site" target="_blank" rel="noopener noreferrer">CLAAngel</a> © 2025. Todos los derechos reservados.</p>
    </footer>
    <!-- Toast container for transient feedback -->
    <div id="toast-container" aria-live="polite" aria-atomic="true"></div>
  </div>

  <!-- Minimal modal for confirmations and alerts -->
  <div id="app-modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-hidden="true">
    <div class="modal-overlay" data-modal-close></div>
    <div class="modal-box" role="document">
      <h2 id="modal-title" class="modal-title">Confirmación</h2>
      <p id="modal-message" class="modal-message">¿Estás seguro?</p>
      <div class="modal-actions">
        <button id="modal-cancel" class="btn btn-muted">Cancelar</button>
        <button id="modal-confirm" class="btn btn-primary">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="/script.js">
    
  </script>
</body>
</html>
